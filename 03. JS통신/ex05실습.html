<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <input type="text" id="text">
    <button id="btn">수집하기</button>
    <script>
        let text = document.getElementById("text");
        let btn = document.getElementById("btn");

        btn.addEventListener("click", async()=>{
            let senddata = text.value;
            btn.disabled = true;

            const url= `http://127.0.0.1:8000/news?senddata=${senddata}`;

            //사용자에게 로딩 중이라는 UI 보여주기
            let p = document.createElement('p');
            let spinner = document.createElement('div');
            p.innerText = '데이터 수집중입니다...';
            spinner.classList.add("spinner");
            p.append(spinner);
            btn.after(p);

            try{
                const res = await fetch(url);

                if (!res.ok){
                    const errtext = await res.text();
                    throw new Error(`에러 발생: ${errtext}`);
                }
                const data = await res.json();
                //console.log(data);
                
                if (btn.nextElementSibling != null){
                    btn.nextElementSibling.remove();
                }
                
                const titleList = data.news;

                let table = document.createElement("table");
                table.border = "1";
                
                /*for (let title in data.news){
                    let tr = document.createElement("tr");
                    let td = document.createElement("td");
                    td.innerText = data.news[i];
                    tr.append(td);
                    table.append(tr);
                
                }*/
                titleList.forEach(e => {
                    
                    let tr = document.createElement("tr");
                    let td = document.createElement('td');
                    
                    td.innerText = e;
                    tr.append(td);
                    table.append(tr);
                });
                btn.after(table);
            }catch(err){
                console.log(err);
            }
        })
    </script>
</body>
</html>
